# HelixTrack Core Stack
# Multi-service stack for running HelixTrack Core from the helix_track repo root.
# Supports multi-space data isolation via --space-root flag.
#
# This compose file is HelixTrack-specific and lives at the helix_track repo root
# (relocated 2026-06-22 from the project-agnostic vasic-digital/containers submodule
# per CONST-051(B) decoupling — the shared containers submodule MUST stay
# project-unaware/reusable). Build context + volumes are relative to THIS repo root.
#
# Usage (from the helix_track repo root):
#   docker compose -f compose.helixtrack.yml up -d
#   OR via the helix_track containers/ submodule pkg/boot:
#     boot --compose ./compose.helixtrack.yml

services:
  # ============================================
  # HELIXTRACK CORE (Go Backend)
  # ============================================
  helixtrack-core:
    build:
      context: ./core/Application
      dockerfile: Dockerfile
    container_name: helixtrack-core
    environment:
      HT_CONFIG: /config/default.json
      HT_SPACE_ROOT: /data/spaces/_default
      HT_DB_TYPE: sqlite
    ports:
      - "8080:8080"
    volumes:
      # Space data (per-project isolated databases + assets)
      - ./spaces:/data/spaces
      # Core configuration
      - ./core/Application/Configurations:/config
    healthcheck:
      # /health is the app's real liveness route; root `/` returns 404 (no route),
      # which made `podman ps` mislabel the healthy container "unhealthy" (real
      # deploy 2026-06-22, docs/qa/20260622-213843-distribute-thinker-green/).
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - helixtrack-net
    restart: unless-stopped
    command: ["./htCore", "--space-root=/data/spaces/_default"]

  # ============================================
  # POSTGRESQL (optional, production target)
  # ============================================
  helixtrack-postgres:
    image: postgres:16-alpine
    container_name: helixtrack-postgres
    environment:
      POSTGRES_DB: helixtrack
      POSTGRES_USER: helixtrack
      POSTGRES_PASSWORD: ${HT_PG_PASSWORD:-helixtrack_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helixtrack -d helixtrack"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - helixtrack-net
    volumes:
      - helixtrack-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - production

networks:
  helixtrack-net:
    name: helixtrack-network
    driver: bridge

volumes:
  helixtrack-pg-data:
